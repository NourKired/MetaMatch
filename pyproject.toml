[tool.poetry]
name = "metamatch"
version = "0.1.0"
description = "Topology-aware meta-features for schema matching."
authors = ["Nour Kired"]
readme = "README.md"
license = "BSD-3-Clause"
packages = [{ include = "metamatch", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
gudhi = ">=3.9"
matplotlib = ">=3.7"
networkx = ">=3.0"
numpy = ">=1.24,<2.0"
pandas = ">=2.0"
pyarrow = ">=14.0"
pyyaml = ">=6.0"
ripser = ">=0.6"
scikit-learn = ">=1.3"
scipy = ">=1.10"
seaborn = ">=0.13"
sentence-transformers = ">=2.6"
tqdm = ">=4.66"

[tool.poetry.group.dev.dependencies]
ipykernel = ">=6.29"
jupyterlab = ">=4.0"
mypy = ">=1.8"
pytest = ">=8.0"
ruff = ">=0.6"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
