[tool.poetry]
name = "metamatch-companion"
version = "0.1.0"
description = "Companion artifact for MetaMatch: topology-aware meta-features for schema matching"
authors = ["Nour Elhouda Kired"]
readme = "README.md"
packages = [{ include = "osirim_occidata", from = "code/src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
pandas = ">=1.5,<2.3"
numpy = ">=1.23,<2.0"
scikit-learn = ">=1.1"
pyyaml = ">=6.0"
tqdm = ">=4.66"
joblib = ">=1.3"
rapidfuzz = ">=3.0"
sentence-transformers = ">=3.0,<6"
pyarrow = ">=10.0"
matplotlib = ">=3.7"
seaborn = ">=0.12"
plotly = ">=5.0"
networkx = ">=3.0"
scipy = ">=1.10"
xgboost = ">=1.7"
catboost = ">=1.2"
shap = ">=0.44"
valentine = ">=0.5.0"

[tool.poetry.group.notebook.dependencies]
jupyter = ">=1.0"
ipykernel = ">=6.0"
nbconvert = ">=7.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
