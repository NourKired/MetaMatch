[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamatch"
version = "0.1.0"
description = "Topology-aware meta-space for schema matching."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "seaborn",
  "networkx",
  "pyarrow",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
