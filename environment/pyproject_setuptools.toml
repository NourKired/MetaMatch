[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osirim-occidata"
version = "0.1.0"
description = "Meta-space pipeline for Valentine datasets with fair baseline benchmarking"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=1.5,<2.3",
  "numpy>=1.23",
  "scikit-learn>=1.1",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "joblib>=1.3",
  "rapidfuzz>=3.0",
  "sentence-transformers>=3.0,<6",
  "pyarrow>=10.0",
  "valentine<0.2; python_version < '3.10'",
  "valentine>=0.5.0; python_version >= '3.10'"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
